<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Neon Text Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradient for Text -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Brand Title centered vertically -->
  <g text-anchor="middle" id="brand-text">
    <!-- SUDO -->
    <text x="960" y="460"
          fill="url(#text-grad)"
          font-family="'Montserrat', 'Arial Black', sans-serif"
          font-size="120"
          font-weight="900"
          letter-spacing="12"
          filter="url(#neon-glow)">SUDO</text>

    <!-- LET US WIN -->
    <text x="960" y="620"
          fill="url(#text-grad)"
          font-family="'Montserrat', 'Arial Black', sans-serif"
          font-size="80"
          font-weight="800"
          letter-spacing="8"
          filter="url(#neon-glow)">LET US WIN</text>
  </g>
</svg>