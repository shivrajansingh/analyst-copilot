# Alembic configuration for the Analyst Copilot API.
#
# The migrations directory is shipped inside the API image (docker/api.Dockerfile)
# and the `migrate` compose service runs `alembic upgrade head` against the
# database the `db` service exposes. Locally: `alembic upgrade head` with
# DATABASE_URL set.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# The URL comes from the environment, never from this file — the same checked-in
# ini runs against a laptop Postgres and the compose `db` service.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
