# The production stack: three services and one one-shot migration, one network.
#
#   browser ──:3000──▶ ui (nginx) ──/api/*──▶ api (uvicorn) ──▶ storage/ filings/
#                                                  │
#                                                  ▼
#                              migrate (alembic) ◀── db (postgres) ──▶ pgdata
#
# `docker compose up` also loads docker-compose.override.yml, which turns both
# app services into hot-reloading development servers. For the built, production
# images run:
#
#     docker compose -f docker-compose.yml up --build
#
# The database holds product state — chat history today, auth tomorrow. The
# index artefacts stay on disk under `storage/`; Postgres never sees a vector.
# `migrate` runs Alembic's `upgrade head` once against a healthy `db`, and the
# API waits for it, so a fresh checkout boots with a migrated schema.

name: analyst-copilot

services:
  db:
    image: postgres:16-alpine
    environment:
      # Local-development credentials, overridable from the shell. Not
      # secrets: the database is not published beyond the compose network.
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst}
      POSTGRES_DB: ${POSTGRES_DB:-analyst}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyst} -d ${POSTGRES_DB:-analyst}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-analyst}:${POSTGRES_PASSWORD:-analyst}@db:5432/${POSTGRES_DB:-analyst}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Provider URLs, keys and models. Copy .env.example to .env first.
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # nginx is same-origin in this stack, so the browser never makes a
      # cross-origin request and the wildcard default is unnecessary.
      API_CORS_ORIGINS: '[]'
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-analyst}:${POSTGRES_PASSWORD:-analyst}@db:5432/${POSTGRES_DB:-analyst}
    depends_on:
      # The schema must exist before the API serves: conversations queries
      # would otherwise fail on a fresh volume. Wait for the migration, not
      # just for the database.
      migrate:
        condition: service_completed_successfully
    volumes:
      # Both are bind mounts on purpose. `filings/` holds the documents an
      # analyst uploaded, `storage/` holds hours of embedding, and both should
      # survive `docker compose down -v` and be readable without a container.
      - ./filings:/app/filings
      - ./storage:/app/storage
    # Uncomment on Linux if the container cannot write to the bind mounts:
    # the image runs as uid 10001, and a bind mount keeps the host's ownership.
    #   user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      # Lets the container reach a provider running on the host — Ollama at
      # http://host.docker.internal:11434/v1, say. Harmless when both providers
      # are remote, which is the default configuration.
      - "host.docker.internal:host-gateway"
    ports:
      # Exposed for curl and /docs. The UI does not use it; it goes over the
      # compose network. Drop this line to keep the API off the host entirely.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    depends_on:
      api:
        # Wait for /api/v1/health, not just for the process. nginx resolves
        # `api` once at startup, so starting before the API has a name to
        # resolve gives a 502 that only a restart clears.
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
