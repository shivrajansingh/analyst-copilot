server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Two limits here are not defaults and both matter.
    #
    # A 64 MB filing is a normal upload for this product -- a filer's own PDF of
    # a 10-K runs well past nginx's 1 MB default, and the failure without this
    # is a 413 the analyst cannot act on.
    client_max_body_size 64m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints every asset filename, so a cached one can never be
    # stale: a changed file is a different URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the one file whose name never changes, so it must never be
    # cached -- otherwise a deploy ships new assets that nothing references.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A question is answered synchronously: retrieval, then a chat
        # completion whose own client timeout is 120s, then verification. The
        # 60s default would cut correct answers off mid-flight.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Stream the upload through rather than spooling all 64 MB to disk
        # before the API sees a byte -- the API enforces its own size cap as
        # the bytes arrive, and cannot do that if nginx buffers first.
        proxy_request_buffering off;

        # POST /api/v1/chat/stream is server-sent events. Response buffering
        # stays on for everything else, and that endpoint opts out per-response
        # with `X-Accel-Buffering: no`, which nginx honours -- otherwise every
        # progress event would be held until the answer arrived and the stream
        # would be pointless. The 300s read timeout above already covers a deep
        # search reading a whole filing; the endpoint also sends a keepalive
        # comment every 15s so an idle connection is never mistaken for a dead
        # one.
    }

    # Client-side routing: /filings and /chat are React Router paths, not
    # files, so anything that is not an asset falls through to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
